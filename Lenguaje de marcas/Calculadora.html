<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Calculadora Bootstrap</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
  </head>
  <body class="bg-dark text-white min-vh-100 d-flex align-items-center justify-content-center">
 <!-- Nombre de la pagina-->
    <div class="container" style="max-width: 420px;">
      <h1 class="fs-4 mb-3">Calculadora by Juan</h1>

      <!-- Lo que se imprime en pantalla-->
      <div class="mb-3">
        <div id="display"
             class="bg-black text-white text-end p-3 rounded fs-2">
          0
        </div>
      </div>

      <!-- Se respeta que la suma total sea de 12 siempre. -->
      <div class="bg-secondary p-3 rounded">

        <!-- Fila 1 -->
        <div class="row g-2 mb-2">
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('7')">7</button>
          </div>
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('8')">8</button>
          </div>
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('9')">9</button>
          </div>
        </div>

        <!-- Fila 2 -->
        <div class="row g-2 mb-2">
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('4')">4</button>
          </div>  
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('5')">5</button>
          </div>       
          <div class="col-4">
            <button class="btn btn-warning w-100 py-2" onclick="agregarNumero('6')">6</button> 
          </div>    
        </div>

        <!-- Fila 3 -->
        <div class="row g-2 mb-2">
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('1')">1</button>
          </div>
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('2')">2</button>
          </div>
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('3')">3</button>
          </div>
        </div>

        <!-- Fila 4 -->
        <div class="row g-2 mb-2">
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('.')">.</button>
          </div>
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('0')">0</button>
          </div>
          <div class="col-4">
            <button class="btn btn-primary w-100 py-2" onclick="agregarNumero('/')">/</button>
          </div>
        </div>

        <!-- Fila 5 -->
        <div class="row g-2 mb-2">
          <div class="col-4">
            <button class="btn btn-danger w-100 py-2" onclick="agregarNumero('+')">+</button>
          </div>
          <div class="col-4">
            <button class="btn btn-danger w-100 py-2" onclick="agregarNumero('-')">-</button>
          </div>
          <div class="col-4">
            <button class="btn btn-danger w-100 py-2" onclick="agregarNumero('*')">*</button>
          </div>
        </div>

        <!-- Fila 6 -->
        <div class="row g-2">
          <div class="col-4">
            <button class="btn btn-danger w-100 py-2" onclick="reiniciar()">BORRAR</button>
          </div>
          <div class="col-8">
            <button class="btn btn-success w-100 py-2" onclick="agregarNumero('=')">=</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    
    <script src="calculadora.js"></script>
  </body>
</html>
