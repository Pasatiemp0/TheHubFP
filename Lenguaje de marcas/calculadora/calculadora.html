<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculadora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <h1>calculadora</h1>
    
    <div class="container-fluid" id="pantalla">
      <table>
        <tbody>
          <tr>
              <td id="historia"></td>
          </tr> 
          <tr>
            <td id="resultado"></td>
          </tr>
        </tbody>          
      </table>
    </div>

    <div class="container-fluid">
      <div class="row">
        <div class="col">
          <button class="btn btn-secondary" type="button">7</button>
          <button class="btn btn-secondary" type="button">8</button>
          <button class="btn btn-secondary" type="button">9</button>
          <button class="btn btn-warning" type="button">DEL</button>
          <button class="btn btn-warning" type="button">AC</button>
        </div>
        <div class="col">
          <button class="btn btn-secondary" type="button">4</button>
          <button class="btn btn-secondary" type="button">5</button>
          <button class="btn btn-secondary" type="button">6</button>
          <button class="btn btn-warning " type="button">x</button>
          <button class="btn btn-warning " type="button">÷</button>
        </div>
        <div class="col">
          <button class="btn btn-secondary" type="button">1</button>
          <button class="btn btn-secondary" type="button">2</button>
          <button class="btn btn-secondary" type="button">3</button>
          <button class="btn btn-warning" type="button">-</button>
          <button class="btn btn-primary" type="button">%</button>
        </div>
        <div class="col">
          <button class="btn btn-secondary" type="button">0</button>
          <button class="btn btn-secondary" type="button">00</button>
          <button class="btn btn-secondary" type="button">.</button>
          <button class="btn btn-warning" type="button">+</button>
          <button class="btn btn-warning" type="button">=</button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-/mhDoLbDldZc3qpsJHpLogda//BVZbgYuw6kof4u2FrCedxOtgRZDTHgHUhOCVim" crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
